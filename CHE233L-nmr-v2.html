<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CHE233L — NMR Reference Spectra</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/openchemlib/8.8.0/openchemlib-full.js"></script>
  <style>
    :root {
      --bg: #0f1117; --surface: #181c26; --border: #2a2f3e;
      --accent: #5bc8af; --accent2: #8b9dff;
      --text: #dde3f0; --muted: #6b748a;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }

    header { border-bottom: 1px solid var(--border); padding: 20px 32px; display: flex; align-items: center; gap: 16px; }
    .eyebrow { font-family: var(--mono); font-size: 10px; color: var(--accent); letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 3px; }
    header h1 { font-size: 20px; font-weight: 500; }
    .badge { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 4px 10px; }

    .app { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 69px); }

    aside { border-right: 1px solid var(--border); overflow-y: auto; padding: 12px 0; }
    .group-label { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); padding: 16px 20px 6px; }
    .mol-btn { display: block; width: 100%; text-align: left; background: none; border: none; cursor: pointer; padding: 9px 20px; color: var(--text); font-family: var(--sans); font-size: 14px; border-left: 3px solid transparent; transition: all 0.12s; }
    .mol-btn:hover { background: var(--surface); color: var(--accent); }
    .mol-btn.active { background: var(--surface); border-left-color: var(--accent); color: var(--accent); }
    .mol-formula { display: block; font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 1px; }
    .mol-btn.active .mol-formula { color: var(--accent); opacity: 0.7; }

    main { display: flex; flex-direction: column; overflow: hidden; }
    .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--muted); }
    .empty-state p { font-family: var(--mono); font-size: 13px; }

    .mol-view { display: none; flex-direction: column; height: 100%; }
    .mol-view.visible { display: flex; }

    .mol-topbar { border-bottom: 1px solid var(--border); padding: 14px 28px; display: flex; align-items: center; gap: 12px; }
    .mol-topbar h2 { font-size: 16px; font-weight: 500; }
    .formula-tag { font-family: var(--mono); font-size: 12px; color: var(--accent2); background: rgba(139,157,255,0.1); border: 1px solid rgba(139,157,255,0.25); border-radius: 4px; padding: 2px 8px; }
    .spec-tabs { margin-left: auto; display: flex; gap: 6px; }
    .spec-tab { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); color: var(--muted); cursor: pointer; background: none; transition: all 0.12s; }
    .spec-tab:hover, .spec-tab.active { border-color: var(--accent); color: var(--accent); background: rgba(91,200,175,0.08); }

    .content-area { flex: 1; display: grid; grid-template-columns: 1fr 260px; overflow: hidden; }

    .spectrum-pane { position: relative; background: #0a0d13; }
    .spectrum-pane iframe { width: 100%; height: 100%; border: none; display: block; }
    .loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px; background: #0a0d13; font-family: var(--mono); font-size: 12px; color: var(--muted); transition: opacity 0.4s; }
    .loading.gone { opacity: 0; pointer-events: none; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 1.2s ease-in-out infinite; }
    .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
    @keyframes blink { 0%,80%,100%{opacity:.2;transform:scale(.8)} 40%{opacity:1;transform:scale(1)} }

    .structure-pane { border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .pane-header { padding: 10px 16px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border); }
    .pane-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 16px; gap: 12px; overflow-y: auto; }

    canvas { display: block; width: 100%; border-radius: 6px; background: #fff; }
    .mol-name-full { font-size: 14px; font-weight: 500; text-align: center; }
    .mol-info { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: center; line-height: 1.8; }
    .open-btn { display: block; width: 100%; padding: 9px; background: rgba(91,200,175,0.08); border: 1px solid rgba(91,200,175,0.3); border-radius: 6px; color: var(--accent); font-family: var(--mono); font-size: 11px; text-align: center; text-decoration: none; transition: background 0.12s; }
    .open-btn:hover { background: rgba(91,200,175,0.16); }
  </style>
</head>
<body>

<header>
  <div>
    <div class="eyebrow">CHE233L · Spectroscopy Lab</div>
    <h1>NMR Reference Spectra</h1>
  </div>
  <div class="badge">Select a compound to view</div>
</header>

<div class="app">
  <aside id="sidebar"></aside>
  <main>
    <div class="empty-state" id="emptyState">
      <p>← Select a compound to begin</p>
    </div>
    <div class="mol-view" id="molView">
      <div class="mol-topbar">
        <h2 id="viewTitle"></h2>
        <span class="formula-tag" id="viewFormula"></span>
        <div class="spec-tabs" id="specTabs"></div>
      </div>
      <div class="content-area">
        <div class="spectrum-pane">
          <div class="loading" id="loader">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            Loading spectrum…
          </div>
          <iframe id="frame" title="NMR Spectrum"></iframe>
        </div>
        <div class="structure-pane">
          <div class="pane-header">Structure</div>
          <div class="pane-body" id="structureBody"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
// ═══════════════════════════════════════════════════
// CONFIGURATION — edit this when you add more compounds
// ═══════════════════════════════════════════════════
const baseUrl = "https://ctheodoreut.github.io/CHE233L";

const groups = [
  {
    label: "Part A — Section I",
    molecules: [
      {
        id: "propane",
        name: "Propane",
        formula: "C₃H₈",
        folder: "10_First/propane",
        spectra: [
          { label: "¹H NMR", file: "1h.jdx" },
        ],
        info: "500 MHz · Methanol-d4 · Predicted",
      },
      // Add more molecules here as you upload them:
      // {
      //   id: "ethanol",
      //   name: "Ethanol",
      //   formula: "C₂H₆O",
      //   folder: "10_First/ethanol",
      //   spectra: [{ label: "¹H NMR", file: "1h.jdx" }],
      //   info: "500 MHz · CDCl₃",
      // },
    ],
  },
  {
    label: "Part A — Section II",
    molecules: [
      // Add Section II molecules here
    ],
  },
];

// ═══════════════════════════════════════════════════
// App logic
// ═══════════════════════════════════════════════════
const sidebar      = document.getElementById("sidebar");
const emptyState   = document.getElementById("emptyState");
const molView      = document.getElementById("molView");
const viewTitle    = document.getElementById("viewTitle");
const viewFormula  = document.getElementById("viewFormula");
const specTabs     = document.getElementById("specTabs");
const frame        = document.getElementById("frame");
const loader       = document.getElementById("loader");
const structureBody= document.getElementById("structureBody");

let activeMolBtn = null;
let activeTab = null;

groups.forEach(group => {
  if (group.molecules.length === 0) return;
  const label = document.createElement("div");
  label.className = "group-label";
  label.textContent = group.label;
  sidebar.appendChild(label);
  group.molecules.forEach(mol => {
    const btn = document.createElement("button");
    btn.className = "mol-btn";
    btn.innerHTML = mol.name + '<span class="mol-formula">' + mol.formula + '</span>';
    btn.addEventListener("click", () => loadMolecule(mol, btn));
    sidebar.appendChild(btn);
  });
});

function loadMolecule(mol, btn) {
  if (activeMolBtn) activeMolBtn.classList.remove("active");
  activeMolBtn = btn;
  btn.classList.add("active");
  emptyState.style.display = "none";
  molView.classList.add("visible");
  viewTitle.textContent = mol.name;
  viewFormula.textContent = mol.formula;

  specTabs.innerHTML = "";
  activeTab = null;
  mol.spectra.forEach((spec, i) => {
    const tab = document.createElement("button");
    tab.className = "spec-tab";
    tab.textContent = spec.label;
    tab.addEventListener("click", () => loadSpectrum(mol, spec, tab));
    specTabs.appendChild(tab);
    if (i === 0) loadSpectrum(mol, spec, tab);
  });

  buildStructure(mol);
}

function loadSpectrum(mol, spec, tab) {
  if (activeTab) activeTab.classList.remove("active");
  activeTab = tab;
  tab.classList.add("active");
  loader.classList.remove("gone");
  const fileUrl = baseUrl + "/" + mol.folder + "/" + spec.file;
  const nmriumUrl = "https://app.nmrium.com/?sampleURL=" + encodeURIComponent(fileUrl);
  frame.src = nmriumUrl;
  frame.onload = () => loader.classList.add("gone");
}

function buildStructure(mol) {
  structureBody.innerHTML = "";

  const nameEl = document.createElement("div");
  nameEl.className = "mol-name-full";
  nameEl.textContent = mol.name;
  structureBody.appendChild(nameEl);

  // Fetch and render the .mol file from GitHub
  const molUrl = baseUrl + "/" + mol.folder + "/structure.mol";
  const canvas = document.createElement("canvas");
  canvas.width = 220;
  canvas.height = 160;
  structureBody.appendChild(canvas);

  fetch(molUrl)
    .then(r => r.text())
    .then(molData => {
      function tryRender() {
        const OCL = window.OCL || window.openchemlib;
        if (!OCL) { setTimeout(tryRender, 300); return; }
        try {
          const molecule = OCL.Molecule.fromMolfile(molData);
          molecule.addImplicitHydrogens();
          OCL.StructureView.drawMolecule(canvas, molecule, { suppressChiralText: true });
        } catch(e) { console.warn("Render error:", e); }
      }
      tryRender();
    })
    .catch(e => console.warn("Could not load mol file:", e));

  if (mol.info) {
    const info = document.createElement("div");
    info.className = "mol-info";
    info.textContent = mol.info;
    structureBody.appendChild(info);
  }

  const link = document.createElement("a");
  link.className = "open-btn";
  link.href = "https://app.nmrium.com/?sampleURL=" + encodeURIComponent(baseUrl + "/" + mol.folder + "/" + mol.spectra[0].file);
  link.target = "_blank";
  link.textContent = "↗ Open in NMRium";
  structureBody.appendChild(link);
}
</script>
</body>
</html>
