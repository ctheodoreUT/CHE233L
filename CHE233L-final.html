<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CHE233L — NMR Reference Spectra</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <!-- SmilesDrawer for structure rendering -->
  <script src="https://unpkg.com/smiles-drawer@2.0.1/src/index.js"></script>
  <style>
    :root {
      --bg:#ffffff;--surface:#f8f9fa;--border:#e0e0e0;
      --accent:#1a73e8;--accent2:#1558b0;
      --text:#202124;--muted:#5f6368;--light:#f1f3f4;
      --mono:'IBM Plex Mono',monospace;--sans:'Inter',sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;}
    header{border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;gap:16px;background:#fff;}
    .eyebrow{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px;}
    header h1{font-size:18px;font-weight:600;color:var(--text);}
    .badge{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--light);border:1px solid var(--border);border-radius:4px;padding:4px 10px;}
    .app{display:grid;grid-template-columns:220px 1fr 220px;height:calc(100vh - 61px);overflow:hidden;}
    aside{border-right:1px solid var(--border);overflow-y:auto;padding:8px 0;background:#fff;}
    .group-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:14px 16px 4px;}
    .mol-btn{display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:8px 16px;color:var(--text);font-family:var(--sans);font-size:14px;border-left:3px solid transparent;transition:all .12s;}
    .mol-btn:hover{background:var(--light);color:var(--accent);}
    .mol-btn.active{background:#e8f0fe;border-left-color:var(--accent);color:var(--accent);}
    .mol-formula{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:1px;}
    .mol-btn.active .mol-formula{color:var(--accent2);}
    .spectrum-area{display:flex;flex-direction:column;overflow:hidden;background:#fff;}
    .spec-topbar{border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:10px;background:var(--surface);}
    .spec-topbar h2{font-size:15px;font-weight:500;color:var(--text);}
    .formula-tag{font-family:var(--mono);font-size:11px;color:var(--accent);background:#e8f0fe;border:1px solid #c5d8f6;border-radius:4px;padding:2px 8px;}
    .spec-tabs{margin-left:auto;display:flex;gap:6px;}
    .spec-tab{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:4px;border:1px solid var(--border);color:var(--muted);cursor:pointer;background:#fff;transition:all .12s;}
    .spec-tab:hover,.spec-tab.active{border-color:var(--accent);color:var(--accent);background:#e8f0fe;}
    #spectrum-container{flex:1;overflow:hidden;}
    .empty-state{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--mono);font-size:13px;height:100%;background:var(--light);}
    .spectrum-iframe{width:100%;height:100%;border:none;display:block;}
    .structure-pane{border-left:1px solid var(--border);display:flex;flex-direction:column;background:#fff;}
    .pane-header{padding:10px 16px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);background:var(--surface);}
    .pane-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;gap:12px;}
    #structure-canvas{display:block;width:100%;border-radius:6px;background:#fff;border:1px solid var(--border);}
    .mol-name-full{font-size:14px;font-weight:600;text-align:center;color:var(--text);}
    .mol-info{font-family:var(--mono);font-size:10px;color:var(--muted);text-align:center;line-height:1.8;}
    .empty-structure{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;}
    aside::-webkit-scrollbar{width:4px;}
    aside::-webkit-scrollbar-track{background:transparent;}
    aside::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
  </style>
</head>
<body>
<header>
  <div>
    <div class="eyebrow">CHE233L &middot; Spectroscopy Lab</div>
    <h1>NMR Reference Spectra</h1>
  </div>
  <div class="badge" id="headerBadge">Select a compound to view</div>
</header>
<div class="app">
  <aside id="sidebar"></aside>
  <div class="spectrum-area">
    <div class="spec-topbar" id="specTopbar" style="display:none">
      <h2 id="viewTitle"></h2>
      <span class="formula-tag" id="viewFormula"></span>
      <div class="spec-tabs" id="specTabs"></div>
    </div>
    <div id="spectrum-container">
      <div class="empty-state" id="emptyState">&larr; Select a compound to begin</div>
    </div>
  </div>
  <div class="structure-pane">
    <div class="pane-header">Structure</div>
    <div class="pane-body" id="structureBody">
      <div class="empty-structure">No compound selected</div>
    </div>
  </div>
</div>
<script>
var baseUrl = "https://che233l.pages.dev";

var groups = [
  {
    label: "Part A — Section I",
    molecules: [
      {
        id: "propane",
        name: "Propane",
        formula: "C₃H₈",
        folder: "10_First/propane",
        spectra: [{ label: "¹H NMR", file: "1h.jdx" }],
        info: "500 MHz · Methanol-d4 · Predicted",
        smiles: "CCC"
      }
    ]
  },
  { label: "Part A — Section II", molecules: [] }
];

var sidebar       = document.getElementById("sidebar");
var emptyState    = document.getElementById("emptyState");
var specTopbar    = document.getElementById("specTopbar");
var viewTitle     = document.getElementById("viewTitle");
var viewFormula   = document.getElementById("viewFormula");
var specTabs      = document.getElementById("specTabs");
var specContainer = document.getElementById("spectrum-container");
var structureBody = document.getElementById("structureBody");
var headerBadge   = document.getElementById("headerBadge");
var activeMolBtn  = null;
var activeTab     = null;

groups.forEach(function(group) {
  if (group.molecules.length === 0) return;
  var label = document.createElement("div");
  label.className = "group-label";
  label.textContent = group.label;
  sidebar.appendChild(label);
  group.molecules.forEach(function(mol) {
    var btn = document.createElement("button");
    btn.className = "mol-btn";
    btn.innerHTML = mol.name + '<span class="mol-formula">' + mol.formula + '</span>';
    btn.addEventListener("click", function() { loadMolecule(mol, btn); });
    sidebar.appendChild(btn);
  });
});

function loadMolecule(mol, btn) {
  if (activeMolBtn) activeMolBtn.classList.remove("active");
  activeMolBtn = btn;
  btn.classList.add("active");
  viewTitle.textContent = mol.name;
  viewFormula.textContent = mol.formula;
  headerBadge.textContent = mol.name;
  specTopbar.style.display = "flex";
  specTabs.innerHTML = "";
  activeTab = null;
  mol.spectra.forEach(function(spec, i) {
    var tab = document.createElement("button");
    tab.className = "spec-tab";
    tab.textContent = spec.label;
    tab.addEventListener("click", function() { loadSpectrum(mol, spec, tab); });
    specTabs.appendChild(tab);
    if (i === 0) loadSpectrum(mol, spec, tab);
  });
  buildStructure(mol);
}

function loadSpectrum(mol, spec, tab) {
  if (activeTab) activeTab.classList.remove("active");
  activeTab = tab;
  tab.classList.add("active");
  emptyState.style.display = "none";
  var old = specContainer.querySelector("iframe");
  if (old) old.remove();
  var fileUrl = baseUrl + "/" + mol.folder + "/" + spec.file;
  var nmriumUrl = "https://dev.nmrium.org/?sampleURL=" + encodeURIComponent(fileUrl);
  var iframe = document.createElement("iframe");
  iframe.className = "spectrum-iframe";
  iframe.src = nmriumUrl;
  iframe.title = "NMR Spectrum";
  specContainer.appendChild(iframe);
}

function buildStructure(mol) {
  structureBody.innerHTML = "";

  var nameEl = document.createElement("div");
  nameEl.className = "mol-name-full";
  nameEl.textContent = mol.name;
  structureBody.appendChild(nameEl);

  if (mol.smiles) {
    var canvas = document.createElement("canvas");
    canvas.id = "structure-canvas";
    canvas.width = 200;
    canvas.height = 150;
    structureBody.appendChild(canvas);

    try {
      var sd = new SmilesDrawer.Drawer({ width: 200, height: 150, bondThickness: 1.5, fontSizeLarge: 14 });
      SmilesDrawer.parse(mol.smiles, function(tree) {
        sd.draw(tree, canvas, "light");
      }, function(err) {
        console.warn("SMILES parse error:", err);
      });
    } catch(e) {
      console.warn("SmilesDrawer error:", e);
    }
  }

  if (mol.info) {
    var info = document.createElement("div");
    info.className = "mol-info";
    info.textContent = mol.info;
    structureBody.appendChild(info);
  }
}
</script>
</body>
</html>
