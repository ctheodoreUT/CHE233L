<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CHE233L — NMR Reference Spectra</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/openchemlib/8.8.0/openchemlib-full.js"></script>
  <style>
    :root {
      --bg:#0f1117;--surface:#181c26;--border:#2a2f3e;
      --accent:#5bc8af;--accent2:#8b9dff;
      --text:#dde3f0;--muted:#6b748a;
      --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;}
    header{border-bottom:1px solid var(--border);padding:20px 32px;display:flex;align-items:center;gap:16px;}
    .eyebrow{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:.14em;text-transform:uppercase;margin-bottom:3px;}
    header h1{font-size:20px;font-weight:500;}
    .badge{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:4px 10px;}
    .app{display:grid;grid-template-columns:240px 1fr 240px;height:calc(100vh - 69px);overflow:hidden;}
    aside{border-right:1px solid var(--border);overflow-y:auto;padding:12px 0;}
    .group-label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:16px 20px 6px;}
    .mol-btn{display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:9px 20px;color:var(--text);font-family:var(--sans);font-size:14px;border-left:3px solid transparent;transition:all .12s;}
    .mol-btn:hover{background:var(--surface);color:var(--accent);}
    .mol-btn.active{background:var(--surface);border-left-color:var(--accent);color:var(--accent);}
    .mol-formula{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:1px;}
    .spectrum-area{display:flex;flex-direction:column;overflow:hidden;background:#0a0d13;}
    .spec-topbar{border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:10px;background:var(--surface);}
    .spec-topbar h2{font-size:15px;font-weight:500;}
    .formula-tag{font-family:var(--mono);font-size:11px;color:var(--accent2);background:rgba(139,157,255,.1);border:1px solid rgba(139,157,255,.25);border-radius:4px;padding:2px 8px;}
    .spec-tabs{margin-left:auto;display:flex;gap:6px;}
    .spec-tab{font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:4px;border:1px solid var(--border);color:var(--muted);cursor:pointer;background:none;transition:all .12s;}
    .spec-tab:hover,.spec-tab.active{border-color:var(--accent);color:var(--accent);background:rgba(91,200,175,.08);}
    #spectrum-container{flex:1;overflow:hidden;}
    .empty-state{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-family:var(--mono);font-size:13px;height:100%;}
    .structure-pane{border-left:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface);}
    .pane-header{padding:10px 16px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);}
    .pane-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 16px;gap:14px;}
    canvas{display:block;width:100%;border-radius:6px;background:#fff;}
    .mol-name-full{font-size:14px;font-weight:500;text-align:center;color:var(--text);}
    .mol-info{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;line-height:1.8;}
    .empty-structure{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center;}
  </style>
</head>
<body>
<header>
  <div>
    <div class="eyebrow">CHE233L &middot; Spectroscopy Lab</div>
    <h1>NMR Reference Spectra</h1>
  </div>
  <div class="badge" id="headerBadge">Select a compound to view</div>
</header>
<div class="app">
  <aside id="sidebar"></aside>
  <div class="spectrum-area">
    <div class="spec-topbar" id="specTopbar" style="display:none">
      <h2 id="viewTitle"></h2>
      <span class="formula-tag" id="viewFormula"></span>
      <div class="spec-tabs" id="specTabs"></div>
    </div>
    <div id="spectrum-container">
      <div class="empty-state" id="emptyState">&larr; Select a compound to begin</div>
    </div>
  </div>
  <div class="structure-pane">
    <div class="pane-header">Structure</div>
    <div class="pane-body" id="structureBody">
      <div class="empty-structure">No compound selected</div>
    </div>
  </div>
</div>

function b64toBlob(b64, type) {
  var bin = atob(b64);
  var buf = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
  return new Blob([buf], { type: type });
}

function loadMolecule(id, btn) {
  var mol = molecules[id];
  if (!mol) return;
  if (activeMolBtn) activeMolBtn.classList.remove("active");
  activeMolBtn = btn;
  btn.classList.add("active");
  viewTitle.textContent = mol.name;
  viewFormula.textContent = mol.formula;
  headerBadge.textContent = mol.name;
  specTopbar.style.display = "flex";
  specTabs.innerHTML = "";

    var tab = document.createElement("button");
    tab.className = "spec-tab";
    tab.textContent = spec.label;
    tab.addEventListener("click", function() { loadSpectrum(spec, tab); });
    specTabs.appendChild(tab);
    if (i === 0) loadSpectrum(spec, tab);
  });
  buildStructure(mol);
}

  var iframe = document.createElement("iframe");

  iframe.title = "NMR Spectrum";
  iframe.srcdoc = buildSpectrumPage(jdxText);
  specContainer.appendChild(iframe);
}

function buildSpectrumPage(jdxText) {
  var escaped = jdxText.replace(/\\/g,"\\\\").replace(/`/g,"\\`").replace(/\$/g,"\\$");
  return '<!DOCTYPE html><html><head><meta charset="UTF-8"/><style>body{margin:0;background:#0a0d13;display:flex;flex-direction:column;font-family:monospace;}canvas{background:#0a0d13;display:block;}#info{color:#6b748a;font-size:11px;padding:6px 12px;text-align:center;}</style></head><body><canvas id="c"></canvas><div id="info">Rendering...</div><script>var jdx=`' + escaped + '`;(function(){' +
    'var lines=jdx.split("\n");' +
    'var xFactor=1,yFactor=1,firstX=0,deltaX=0,xUnits="HZ";' +
    'var ys=[],inData=false;' +
    'for(var i=0;i<lines.length;i++){' +
      'var t=lines[i].trim();' +
      'if(t.startsWith("##XFACTOR="))xFactor=parseFloat(t.split("=")[1]);' +
      'if(t.startsWith("##YFACTOR="))yFactor=parseFloat(t.split("=")[1]);' +
      'if(t.startsWith("##FIRSTX="))firstX=parseFloat(t.split("=")[1]);' +
      'if(t.startsWith("##DELTAX="))deltaX=parseFloat(t.split("=")[1]);' +
      'if(t.startsWith("##XUNITS="))xUnits=t.split("=")[1].trim();' +
      'if(t.startsWith("##XYDATA=")){inData=true;continue;}' +
      'if(t.startsWith("##")&&inData){inData=false;}' +
      'if(inData&&t&&!t.startsWith("$$")){' +
        'var parts=t.replace(/[A-Za-z@%]/g," ").trim().split(/\\s+/);' +
        'for(var j=1;j<parts.length;j++){var y=parseFloat(parts[j])*yFactor;if(!isNaN(y))ys.push(y);}' +
      '}' +
    '}' +
    'var xs=[];var dx=deltaX!==0?deltaX*xFactor:-xFactor;' +
    'for(var k=0;k<ys.length;k++)xs.push(firstX*xFactor+k*dx);' +
    'var ppmXs=xUnits.toUpperCase().includes("HZ")?xs.map(function(x){return x/500;}):xs;' +
    'var canvas=document.getElementById("c");' +
    'var W=window.innerWidth,H=window.innerHeight-30;' +
    'canvas.width=W;canvas.height=H;' +
    'var ctx=canvas.getContext("2d");' +
    'if(ppmXs.length>0){' +
      'var xMin=Math.min.apply(null,ppmXs),xMax=Math.max.apply(null,ppmXs);' +
      'var yMax=Math.max.apply(null,ys);' +
      'var pad={l:55,r:15,t:15,b:40};' +
      'var pw=W-pad.l-pad.r,ph=H-pad.t-pad.b;' +
      'ctx.fillStyle="#0a0d13";ctx.fillRect(0,0,W,H);' +
      'ctx.strokeStyle="#1a1f2e";ctx.lineWidth=1;' +
      'for(var p=Math.ceil(xMin*2)/2;p<=xMax;p+=0.5){' +
        'var cx=pad.l+(xMax-p)/(xMax-xMin)*pw;' +
        'ctx.beginPath();ctx.moveTo(cx,pad.t);ctx.lineTo(cx,pad.t+ph);ctx.stroke();' +
      '}' +
      'ctx.strokeStyle="#c0392b";ctx.lineWidth=1.5;ctx.beginPath();' +
      'ppmXs.forEach(function(x,i){' +
        'var cx2=pad.l+(xMax-x)/(xMax-xMin)*pw;' +
        'var cy=pad.t+ph-(ys[i]/yMax)*ph;' +
        'i===0?ctx.moveTo(cx2,cy):ctx.lineTo(cx2,cy);' +
      '});ctx.stroke();' +
      'ctx.fillStyle="#6b748a";ctx.font="11px monospace";ctx.textAlign="center";' +
      'for(var p2=Math.ceil(xMin*2)/2;p2<=xMax;p2+=0.5){' +
        'var cx3=pad.l+(xMax-p2)/(xMax-xMin)*pw;' +
        'ctx.fillText(p2.toFixed(1),cx3,pad.t+ph+18);' +
      '}' +
      'ctx.fillStyle="#5bc8af";ctx.font="11px monospace";ctx.textAlign="center";' +
      'ctx.fillText("\u03b4 (ppm)",pad.l+pw/2,H-4);' +
      'document.getElementById("info").textContent=ppmXs.length+" data points";' +
    '}else{ctx.fillStyle="#0a0d13";ctx.fillRect(0,0,W,H);ctx.fillStyle="#666";ctx.font="13px monospace";ctx.textAlign="center";ctx.fillText("Could not parse spectrum",W/2,H/2);}' +
  '})();<\/script></body></html>';
}

function buildStructure(mol) {
  structureBody.innerHTML = "";
  var nameEl = document.createElement("div");
  nameEl.className = "mol-name-full";
  nameEl.textContent = mol.name;
  structureBody.appendChild(nameEl);
  var canvas = document.createElement("canvas");
  canvas.width = 200; canvas.height = 150;
  structureBody.appendChild(canvas);
  function tryRender() {
    var OCL = window.OCL || window.openchemlib;
    if (!OCL) { setTimeout(tryRender, 300); return; }
    try {
      var molecule = OCL.Molecule.fromMolfile(mol.mol);
      molecule.addImplicitHydrogens();
      OCL.StructureView.drawMolecule(canvas, molecule, { suppressChiralText: true });
    } catch(e) { console.warn("Render error:", e); }
  }
  setTimeout(tryRender, 600);
  if (mol.info) {
    var info = document.createElement("div");
    info.className = "mol-info";
    info.textContent = mol.info;
    structureBody.appendChild(info);
  }
}
</script>
</body>
</html>
